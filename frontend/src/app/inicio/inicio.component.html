<div class="layout">

  <!-- ================= HEADER ================= -->

  <header class="topbar">

    <!-- Logo -->
    <div class="topbar__brand">

      <img
        class="topbar__logo"
        src="assets/img/escudo-granados.png"
        alt="Escudo de la Municipalidad de Granados"
      >

    </div>

    <!-- Nombre del sistema -->
    <div class="topbar__title">

      <span class="topbar__system">
        Sistema de Quejas, Reclamos, Denuncias y Sugerencias
      </span>

      <span class="topbar__institution">
        Municipalidad de Granados, B.V.
      </span>

    </div>

    <!-- Usuario -->
    <div class="topbar__user">

      <span class="topbar__user-name">
        {{ nombreUsuario }}
      </span>

    </div>

  </header>


  <!-- ================= CONTENIDO ================= -->

  <div class="layout__body">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

      <nav class="sidebar__nav">

        <button type="button" class="sidebar__item sidebar__item--active">
          Casos Asignados
        </button>
        <button type="button" class="sidebar__item">
          Casos en Revisión
        </button>
        <button type="button" class="sidebar__item">
          Reportes
        </button>

      </nav>


      <!-- Cerrar sesión -->
      <div class="sidebar__bottom">

        <button
          type="button"
          class="sidebar__logout"
          (click)="cerrarSesion()"
        >
          <span class="sidebar__icon">
            ↪
          </span>

          <span>
            Cerrar sesión
          </span>
        </button>

      </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="content">
      <div class="panel">
        <button type="button" class="panel__card">Casos Asignados</button>
        <button type="button" class="panel__card">Casos en Revisión</button>
        <button type="button" class="panel__card">Reportes</button>
      </div>
    </main>

  </div>

</div>
