<main class="password-page">

  <section class="password-card">

    <div class="password-card__header">

      <span class="password-card__eyebrow">
        Recuperación de acceso
      </span>

      <h1 class="password-card__title">
        ¿Olvidaste tu contraseña?
      </h1>

      <span class="rule"></span>

      <p class="password-card__description">
        Ingresa el correo electrónico asociado a tu cuenta y te enviaremos
        las instrucciones para recuperar tu contraseña.
      </p>

    </div>

    @if (!enviado) {

      <form
        class="password-form"
        (ngSubmit)="recuperarPassword()"
      >

        <div class="password-form__field">

          <label
            class="password-form__label"
            for="correo"
          >
            Correo electrónico
          </label>

          <input
            id="correo"
            name="correo"
            class="password-form__input"
            type="email"
            placeholder="correo@dominio.com"
            autocomplete="email"
            [(ngModel)]="correo"
            required
          >

        </div>

        @if (error) {
          <div
            class="password-form__error"
            role="alert"
          >
            {{ error }}
          </div>
        }

        <button
          type="submit"
          class="password-form__button"
          [disabled]="cargando"
        >
          {{ cargando ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>

      </form>

    } @else {

      <div
        class="password-form__success"
        role="status"
      >
        <p>
          {{ mensaje }}
        </p>
      </div>

    }

    <a
      class="password-page__back"
      routerLink="/login"
    >
      ← Volver al inicio de sesión
    </a>

  </section>

</main>
