<main class="login">

  <section class="login__card" aria-labelledby="login-title">

    <!-- Encabezado -->
    <header class="login__header">

      <img
        class="login__seal"
        src="assets/img/escudo-granados.png"
        alt="Escudo de la Municipalidad de Granados"
      >

      <p class="login__eyebrow">
        Municipalidad de Granados
      </p>

      <h1 id="login-title" class="login__title">
        Iniciar sesión
      </h1>
    </header>


    <!-- Formulario -->
    <form class="login__form" (ngSubmit)="iniciarSesion()">

      <!-- Usuario -->
      <div class="login__field">

        <label
          class="login__label"
          for="usuario"
        >
          Usuario
        </label>

        <input
          id="usuario"
          name="usuario"
          class="login__input"
          type="text"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          [(ngModel)]="usuario"
          required
        >

      </div>


      <!-- Contraseña -->
      <div class="login__field">

        <label
          class="login__label"
          for="password"
        >
          Contraseña
        </label>

        <div class="login__password">

          <input
            id="password"
            name="password"
            class="login__input"
            [type]="mostrarPassword ? 'text' : 'password'"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            [(ngModel)]="password"
            required
          >

          <button
            type="button"
            class="login__password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            👁
          </button>

        </div>

      </div>


      <!-- Opciones -->
      <div class="login__options">

        <a
          class="login__forgot"
          routerLink="/recuperar-password"
        >
          ¿Olvidaste tu contraseña?
        </a>

      </div>


      <!-- Error de autenticación -->
      
      @if (error) {
      <div
        class="login__error"
        role="alert"
      >
        {{ error }}
      </div>
      }

      <!-- Botón -->
      <button
        type="submit"
        class="login__button"
      >
        Iniciar sesión
      </button>

    </form>


    <!-- Separador -->
    <div class="login__divider">
      <span>o</span>
    </div>


    <!-- Regresar al portal -->
    <a
      class="login__back"
      routerLink="/"
    >
      ← Volver al portal
    </a>


    <!-- Footer de la tarjeta -->
    <footer class="login__footer">

      <span>
        Sistema de Quejas · Municipalidad de Granados
      </span>

    </footer>

  </section>

</main>
