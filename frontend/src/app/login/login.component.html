<main class="login">

  <section class="login__card" aria-label="Formulario de ingreso">

    <!-- Encabezado -->
    <header class="login__header">

      <img
        class="login__seal"
        src="assets/img/escudo-granados.png"
        alt="Escudo de la Municipalidad de Granados"
      >

      <p class="login__eyebrow">
        Municipalidad de Granados, B.V.
      </p>
    </header>


    <!-- Formulario -->
    <form class="login__form" (ngSubmit)="acceder()">

      <div class="login__field">
        <label class="login__label" for="tipoUsuario">Tipo de usuario</label>
        <select
          id="tipoUsuario"
          name="tipoUsuario"
          class="login__input"
          [(ngModel)]="tipoUsuario"
          (ngModelChange)="alCambiarTipo()"
        >
          <option value="">Seleccione</option>
          <option value="Ciudadano">Ciudadano</option>
          <option value="Empleado">Empleado</option>
        </select>
      </div>

      @if (tipoUsuario) {
      <div class="login__field">
        <label class="login__label" for="usuario">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          class="login__input"
          type="text"
          [placeholder]="tipoUsuario === 'Ciudadano' ? 'Ingresar DPI de 13 dígitos' : 'Ingrese su correo electrónico'"
          [attr.maxlength]="tipoUsuario === 'Ciudadano' ? 13 : null"
          [attr.inputmode]="tipoUsuario === 'Ciudadano' ? 'numeric' : null"
          autocomplete="username"
          [(ngModel)]="usuario"
          (blur)="alSalirUsuario()"
        >
      </div>
      }

      @if (tipoUsuario === 'Empleado') {
      <div class="login__field">
        <label class="login__label" for="password">Contraseña</label>
        <div class="login__password">
          <input
            id="password"
            name="password"
            class="login__input"
            [type]="mostrarPassword ? 'text' : 'password'"
            placeholder="Ingresar contraseña, mínimo 6 caracteres"
            autocomplete="current-password"
            [(ngModel)]="password"
          >
          <button
            type="button"
            class="login__password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            👁
          </button>
        </div>
      </div>
      }

      @if (tipoUsuario === 'Ciudadano') {
      <div class="login__field">
        <label class="login__label" for="passwordCiudadano">Contraseña</label>
        <input
          id="passwordCiudadano"
          name="passwordCiudadano"
          class="login__input"
          type="text"
          [placeholder]="codigoEnviado ? 'Coloque el código aquí' : ''"
          autocomplete="off"
          [(ngModel)]="password"
        >
      </div>
      }


      @if (aviso) {
      <div class="login__aviso" role="status">{{ aviso }}</div>
      }


      <!-- Error de autenticación -->
      
      @if (error) {
      <div
        class="login__error"
        role="alert"
      >
        {{ error }}
      </div>
      }

      @if (tipoUsuario) {
      <button
        type="submit"
        class="login__button"
        [disabled]="cargando"
      >
        Acceder
      </button>
      }

      <a class="login__back" routerLink="/">Regresar</a>

    </form>

  </section>

</main>
