# Nginx como punto de entrada único: sirve el frontend (Angular) y
# redirige las peticiones /api hacia el backend (Spring Boot).

server {
    listen 80;
    server_name _;

    # Frontend (Angular servido por su propio contenedor nginx interno)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # IP real del cliente: importante para la bitacora de sesiones (RN-CU01-06)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
