server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sistema-quejas
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, no Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
api:
  security:
    secret: ${API_SECURITY_SECRET}

# Catalogos precargados en cache (RN-CU02-01): tiempo de vida antes de refrescar
app:
  cache:
    catalogos-ttl-minutos: 60
  evidencia:
    tamano-maximo-mb: 100
  archivos:
    directorio: ${APP_ARCHIVOS_DIRECTORIO:./data/archivos}
